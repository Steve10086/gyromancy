plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // ── Local Maven repository (checked FIRST) ──
    // Drop JARs into ./libs/, they auto-install on compile.
    // If a dependency is found here, it wins — no remote request is made.
    maven {
        name = "LocalRepo"
        url = file("${project.projectDir}/repo")
    }

    // ── Maven Central (required for ONNX Runtime) ──
    mavenCentral()

    // ── Remote repositories (fallback) ──
    // Checked only when a dependency is NOT found in LocalRepo above.
    // Each remote is scoped to its own group to avoid unnecessary lookups.

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // ── Modopedia ──
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // ── Veil — FoundryMC rendering library ──
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "foundry.veil"
            includeGroup "mezz.jei"
        }
    }

    // ── Photon + LDLib2 — VFX library ──
    maven {
        name = "FirstDark"
        url = "https://maven.firstdark.dev/snapshots"
        content {
            includeGroup "com.lowdragmc.ldlib2"
            includeGroup "com.lowdragmc.photon"
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

sourceSets { test { compileClasspath += sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.runtimeClasspath } }

dependencies {
    implementation "maven.modrinth:pigmentum:0.6.1beta"
    implementation "curse.maven:modopedia-1132038:8043293"
    implementation "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"

    // ── Photon + LDLib2 — VFX library ──
    // :all classifier bundles Yoga inside, remove transitive to avoid classpath conflicts
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }
    implementation("com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon2_version}") { transitive = false }
    compileOnly("org.appliedenergistics.yoga:yoga:1.0.0")

    // Optional JEI API: the plugin is discovered by JEI only when JEI is installed.
    // compileOnly keeps both the API and the full JEI implementation out of Gyromancy's JAR.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // ── Testing ──
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ── ONNX Runtime for ML inference ──
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.18.0'

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---- Auto-install JARs from ./libs into local Maven repo ----
// Drop JARs into ./libs/ with one of these naming patterns:
//   <artifact>-<version>.jar          → uses local_repo_default_group
//   <group>--<artifact>-<version>.jar → explicit group (double hyphen separator)
// They are automatically installed into ./repo/ before compilation.
def _libsDir   = file("${project.projectDir}/libs")
def _repoDir   = file("${project.projectDir}/repo")
def _defaultGroup = findProperty('local_repo_default_group') ?: 'local.dependency'

tasks.register('autoInstallLocalDeps') {
    group = 'local repo'
    description = 'Scan ./libs for JARs and install them into the local Maven repo'

    inputs.dir(_libsDir)
    outputs.dir(_repoDir)

    doLast {
        if (!_libsDir.isDirectory()) return

        // Pattern: [group--]artifact-version.jar
        // Version MUST contain at least one dot (e.g. 0.5.7, 19.8.0, 0.5.7-1beta).
        // The greedy capture ensures artifact can contain digits/versions too (e.g. jei-1.21.1-neoforge).
        def JAR_PATTERN = ~/^(?:(.+)--)?(.+)-(\d+\.\d+[-\w.]*)\.jar$/

        _libsDir.eachFile { jarFile ->
            if (!jarFile.name.endsWith('.jar')) return

            def matcher = jarFile.name =~ JAR_PATTERN
            if (!matcher.matches()) {
                logger.warn("Skipping '${jarFile.name}' — cannot parse Maven coords from filename. Expected: [group--]artifact-version.jar")
                return
            }

            def groupId    = matcher.group(1) ?: _defaultGroup
            def artifactId = matcher.group(2)
            def version    = matcher.group(3)

            def targetDir = new File("${_repoDir}/${groupId.replace('.', '/')}/${artifactId}/${version}")
            def targetJar = new File(targetDir, "${artifactId}-${version}.jar")

            // Skip if already up-to-date (source not newer than target)
            if (targetJar.exists() && targetJar.lastModified() >= jarFile.lastModified()) {
                logger.info("Up-to-date: ${groupId}:${artifactId}:${version}")
                return
            }

            targetDir.mkdirs()
            new File(targetDir, "${artifactId}-${version}.jar").withOutputStream { out ->
                jarFile.withInputStream { it.transferTo(out) }
            }

            // Minimal POM
            new File(targetDir, "${artifactId}-${version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd"
         xmlns="http://maven.apache.org/POM/4.0.0"
         xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
    <modelVersion>4.0.0</modelVersion>
    <groupId>${groupId}</groupId>
    <artifactId>${artifactId}</artifactId>
    <version>${version}</version>
</project>"""

            logger.lifecycle("Installed ${groupId}:${artifactId}:${version} (from ${jarFile.name})")
        }
    }
}

// Wire into compilation so dropping a JAR is enough — no manual Gradle task needed.
tasks.named('compileJava') { dependsOn autoInstallLocalDeps }

// The IDE's forgeclientdev configuration scans run/mods directly and does not
// always include remote mod artifacts from Gradle's runtime classpath. Keep the
// Modopedia library available for that launch path without bundling it into the
// Gyromancy artifact or changing the other runtime dependencies.
def modopediaStagingClasspath = configurations.runtimeClasspath
def modopediaDevModsDir = file("${project.projectDir}/run/mods")
tasks.register('stageModopediaForDev') {
    group = 'mod development'
    description = 'Copies the resolved Modopedia mod into run/mods for IDE launches.'
    inputs.files(modopediaStagingClasspath)

    doLast {
        def modopediaJars = modopediaStagingClasspath.files.findAll {
            it.name.toLowerCase(Locale.ROOT).contains('modopedia')
        }
        if (modopediaJars.size() != 1) {
            throw new GradleException("Expected exactly one resolved Modopedia JAR, found ${modopediaJars.size()}")
        }

        def modopediaJar = modopediaJars[0]
        modopediaDevModsDir.mkdirs()
        java.nio.file.Files.copy(
                modopediaJar.toPath(),
                new File(modopediaDevModsDir, modopediaJar.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        logger.lifecycle("Staged Modopedia: ${modopediaJar.name}")
    }
}
